version: '3.8'

services:
  kirithraweb:
    build: .
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=kirithraweb.rockmypost.com
      - EMAIL=pablo@rockmypost.com
    restart: unless-stopped
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  certbot_data:
  certbot_www:
