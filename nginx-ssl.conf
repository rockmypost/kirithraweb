server {
    listen 80;
    server_name kirithraweb.rockmypost.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kirithraweb.rockmypost.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kirithraweb.rockmypost.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirithraweb.rockmypost.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
